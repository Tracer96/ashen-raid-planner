<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashen Raid Planner</title>
<meta name="description" content="Drag-and-drop raid assignments for BWL and AQ40: tanks, healers, marks and groups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a; --line2:#353b48;
  --text:#e7e9ee; --muted:#9aa1ae; --faint:#6b7280;
  --accent:#d9a441; --accent2:#f0c46a; --danger:#e06666; --ok:#6fbf73;
  --drop:#2a3446; --drophi:#34507a;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent2)}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:Cinzel,serif;font-weight:700;font-size:20px;letter-spacing:.5px;color:var(--accent2);white-space:nowrap}
.brand small{font-family:Inter,sans-serif;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.meta input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:140px}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1307}
.btn.primary:hover{background:var(--accent2)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent}
.tabs{display:flex;gap:2px;padding:0 16px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent)}
.saved{font-size:12px;color:var(--faint)}

/* layout */
.wrap{display:grid;grid-template-columns:clamp(280px,22vw,360px) minmax(0,1fr);gap:18px;padding:16px 20px;max-width:2000px;margin:0 auto}
aside{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
aside h3{margin:0;font-family:Cinzel,serif;font-size:18px;color:var(--accent2);letter-spacing:.3px}
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rhead .cnt{font-size:12px;color:var(--muted);flex:1}
.rhead .btn{padding:4px 10px}
aside{background:linear-gradient(180deg,#1a1e27,var(--panel) 120px)!important}
#benchlist .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px}
#benchlist .chip{width:100%;padding:6px 8px 6px 8px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 16%,#232833),#232833 70%)}
#benchlist .chip .nm{flex:1}
#benchlist .chip small{font-size:10px;font-weight:500;color:var(--faint);margin-left:auto}
#benchlist .chip .ct{margin-left:2px}
.rgroup{background:#14171d;border:1px solid var(--line);border-radius:9px;padding:8px}
.rgroup h4{display:flex;align-items:center;gap:7px}
.rgroup h4 .ri{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:11px;background:#232833;color:var(--accent2)}
.rgroup h4 .n{margin-left:auto;color:var(--muted);font-weight:600}
.addform[hidden]{display:none}
.hint{font-size:12px;color:var(--faint);margin:0 0 10px}
.addform{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px;display:grid;gap:6px}
.addform input,.addform select{background:#14171d;border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.addrow .btn{grid-column:1/-1}
.sitout{margin:0 0 10px;color:#e0a066}
.bx{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 14px;padding:8px 4px 12px}
.bx h6{grid-column:1/-1;margin:6px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.bx label{display:flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.bx input{width:auto}
.bxbtn{background:#14171d;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;color:var(--muted)}
.bxbtn.skip{color:#e0a066;border-color:#5a4026}
.bxbtn:hover{border-color:var(--accent)}
.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:10px}
.rgroup{margin-bottom:8px}
.rgroup h4{margin:0 0 7px;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
main{min-width:0}

/* player chip */
.chip{--cc:#888;display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 8px 4px 6px;border-radius:7px;background:#232833;border:1px solid #303644;border-left:4px solid var(--cc);
  font-weight:600;font-size:13px;color:var(--cc);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;white-space:nowrap}
.chip:hover{background:#2a303c}
.chip .nm{overflow:hidden;text-overflow:ellipsis}
.chip .ct{font-size:10px;font-weight:700;color:var(--muted);background:#151820;border-radius:5px;padding:0 5px;line-height:16px}
.chip.out{opacity:.45;text-decoration:line-through}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.chip.unknown{--cc:#e06666;border-style:dashed}
.dragghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) rotate(-2deg);box-shadow:0 8px 24px rgba(0,0,0,.5)}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging .drop{background:var(--drop)}
.drop.hi{background:var(--drophi)!important;outline:2px solid var(--accent)}

/* cards */
.card{scroll-margin-top:112px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,var(--bossc,#3a2a14),transparent 80%);border-bottom:1px solid var(--line)}
.card>.hd h2{margin:0;font-family:Cinzel,serif;font-size:17px;font-weight:700;flex:1}
.card>.hd .num{font-family:Cinzel,serif;color:var(--accent2);font-weight:700}
.card .bd{padding:12px 14px}
.card.collapsed .bd{display:none}
.caret{background:none;border:none;color:var(--muted);font-size:14px;padding:2px 6px}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.sec h5{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.row{display:grid;grid-template-columns:14px minmax(100px,1.2fr) minmax(120px,1fr) 44px 20px;gap:6px;align-items:center;margin-bottom:5px}
input.lb,input.sech{min-width:0;width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin-left:-6px;font-size:13px;color:var(--text);text-overflow:ellipsis}
input.lb:hover,input.sech:hover{border-color:var(--line2);background:#14171d}
input.lb:focus,input.sech:focus{outline:none;border-color:var(--accent);background:#14171d}
input.sech{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:2px 6px;margin-bottom:4px}
.row.nomk{grid-template-columns:14px minmax(100px,1fr) minmax(140px,1.3fr) 20px}
.grip{color:var(--faint);cursor:grab;font-size:13px;line-height:1;user-select:none;-webkit-user-select:none;touch-action:none;text-align:center;opacity:.55}
.row:hover .grip{opacity:1}
.row.dragrow{opacity:.35}
.row.before{box-shadow:0 -2px 0 var(--accent)}
.row.after{box-shadow:0 2px 0 var(--accent)}
.tabs .tab.dragover{box-shadow:inset 2px 0 0 var(--accent)}
.tabmore{background:none;border:none;color:var(--faint);padding:9px 10px;font-weight:700}
.tabmore:hover{color:var(--accent2)}
.ctx{position:fixed;z-index:120;background:#1f242e;border:1px solid var(--line2);border-radius:9px;padding:4px;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ctx button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:7px 10px;font-size:13px}
.ctx button:hover{background:#2a3140}
.ctx button:disabled{opacity:.35;background:none;cursor:default}
.ctx hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
.ctx .lbl{font-size:11px;color:var(--faint);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.06em}
.row .rm{opacity:0;padding:2px 4px}
.row:hover .rm,.row .rm:focus{opacity:1}
@media (hover:none){.row .rm{opacity:.6}}
.addslot{background:none;border:1px dashed var(--line2);border-radius:7px;color:var(--faint);font-size:12px;padding:3px 10px;margin-top:2px}
.addslot:hover{color:var(--accent2);border-color:var(--accent)}
.drop{min-height:30px;border:1px dashed var(--line2);border-radius:7px;padding:2px;display:flex;align-items:center;gap:4px;background:#14171d;transition:background .1s}
.drop.filled{border-style:solid;border-color:#2c3240}
.drop .chip{flex:1;min-width:0}
.drop .empty{font-size:12px;color:var(--faint);padding:0 6px}
.drop.inherit .chip{border-style:dotted;background:#1d2129}
.x{background:none;border:none;color:var(--faint);font-size:15px;line-height:1;padding:2px 5px;border-radius:5px}
.x:hover{color:var(--danger);background:#2a1f22}
.mk{appearance:none;-webkit-appearance:none;width:44px;height:30px;border-radius:7px;border:1px solid var(--line2);background:#14171d;text-align:center;text-align-last:center;font-size:15px;padding:0;cursor:pointer}
.mk:hover{border-color:var(--accent)}
.notes{margin:12px 0 0;padding:10px 12px 10px 28px;background:#14171d;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:13px}
.notes li{margin:3px 0}
.strat{margin-top:12px}
.strath{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.strath span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);flex:1}
.strat .notes{margin:0}
textarea.stratbox{margin-top:0;font-size:13px;line-height:1.5}
.mv{padding:3px 8px}
.mv:disabled{opacity:.3;cursor:default}
.ppick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ppick select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-weight:600;min-width:180px}
.pfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pfacts div{background:#14171d;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pfacts .k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:3px}
.pboss{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #20242d}
.pboss:last-child{border-bottom:none}
.pbn{font-weight:700;color:var(--accent2)}
.pjob{display:flex;align-items:center;gap:8px;margin:2px 0}
.pjob small{color:var(--faint)}
.pjob .mi{width:20px;height:20px;font-size:12px}
@media (max-width:520px){.pboss{grid-template-columns:1fr;gap:4px}}
.card .bd{container-type:inline-size}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.cgrid .mapwrap{grid-column:1/-1;order:-1;margin-top:0}
.cl,.cr{display:grid;gap:12px;align-content:start;min-width:0}
.cgrid.nomap{grid-template-columns:1fr}
.cgrid.nomap .cl{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.cgrid.nomap .cr{display:none}
@container (min-width:980px){
  .cgrid:not(.nomap){grid-template-columns:minmax(290px,.85fr) minmax(0,1.5fr) minmax(290px,.85fr);gap:12px;align-items:stretch}
  .cgrid:not(.nomap) .mapwrap{grid-column:auto;order:0;display:flex;flex-direction:column}
  .cgrid:not(.nomap) .mapwrap .mapframe{flex:1;height:auto;min-height:380px}
  .cgrid .maphd .hint{display:none}
  .cgrid:not(.nomap) .row{grid-template-columns:12px minmax(64px,1fr) minmax(92px,1.15fr) 36px 16px;gap:5px}
  .cgrid:not(.nomap) .row .mk{width:36px}
  .cgrid:not(.nomap) input.sech{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@container (max-width:600px){ .cgrid{grid-template-columns:1fr} }
.mapwrap{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0a090c}
.maphd{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#14171d;border-bottom:1px solid var(--line)}
.maphd>span:first-child{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mapframe{display:block;width:100%;height:clamp(300px,52vh,560px);border:0;background:#0a090c}
.fullmap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fullmap .mapframe{height:calc(100vh - 150px);min-height:480px}
details.mech{margin-top:12px;background:#14171d;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
details.mech summary{cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:3px 0}
details.mech .strat{margin-top:6px}
#mapov{position:fixed;inset:0;z-index:300;background:#000}
#mapov iframe{width:100%;height:100%;border:0;display:block}
body.ovopen{overflow:hidden}
@media (max-width:560px){.maphd .hint{display:none}}
textarea.free{width:100%;margin-top:10px;min-height:54px;background:#14171d;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.bossnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bossnav button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.bossnav button:hover{color:var(--text);border-color:var(--accent)}

/* setup */
.setupgrid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2fr);gap:14px}
@media (max-width:1100px){.setupgrid{grid-template-columns:1fr}}
.mkgrid{display:grid;grid-template-columns:150px repeat(3,minmax(110px,1fr));gap:6px;align-items:center;margin-bottom:6px}
.mkhead span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.mkw{display:block;width:100%;background:transparent;border:1px solid transparent;border-radius:5px;padding:1px 4px;margin-left:-4px;font-size:11px;color:var(--faint)}
.mkw:hover,.mkw:focus{border-color:var(--line2);background:#14171d;outline:none;color:var(--text)}
@media (max-width:700px){.mkgrid{grid-template-columns:1fr 1fr}.mkgrid .mname{grid-column:1/-1}.mkhead{display:none}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.mrow{display:grid;grid-template-columns:minmax(110px,150px) minmax(120px,1fr) 26px;gap:8px;align-items:center;margin-bottom:6px}
.mname{display:flex;align-items:center;gap:8px;font-weight:600}
.mname small{display:block;font-weight:400;font-size:11px;color:var(--faint)}
.mi{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:14px;flex:none;background:#14171d;border:1px solid var(--line2)}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.grp h4{margin:0 0 8px;display:flex;justify-content:space-between;font-size:13px}
.grp h4 span{color:var(--faint);font-weight:500}
.grp .drop{margin-bottom:5px}
.ungrouped{margin-top:14px}

/* roster table */
table.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
.rt td{padding:4px 6px;border-bottom:1px solid #20242d}
.rt input,.rt select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%}
.rt input.nm{font-weight:600}
.rt .sw{width:10px;height:22px;border-radius:3px}
.tablewrap{overflow-x:auto}

.selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:var(--accent);color:#1a1307;font-weight:700;padding:9px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;align-items:center;gap:10px;max-width:calc(100vw - 32px)}
.selbar.on{display:flex}
.selbar button{background:#1a1307;color:var(--accent2);border:none;border-radius:999px;padding:3px 10px;font-weight:700}
.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:#22303f;border:1px solid #34507a;color:var(--text);padding:10px 14px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:12px 16px}
  aside{position:relative;top:0;max-height:none}
  .meta input{width:120px}
  header{position:relative}
}
@media (max-width:420px){
  .secs{grid-template-columns:1fr}
  .row{grid-template-columns:14px minmax(76px,1fr) minmax(110px,1.3fr) 40px 18px}
}
/* per-raid lineup */
.lrpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.mrow input.mlb{font-weight:600}
.mrow .addrow,.card .addrow{margin-top:6px}
/* view-only links */
.vobanner{display:none;align-items:center;gap:8px;padding:7px 12px;margin:12px 20px 0;border-radius:8px;border:1px solid var(--line2);background:#1f242e;color:var(--muted);font-size:13px}
body.viewonly .vobanner{display:flex}
body.viewonly :is([data-rmboss],#b-reset,#b-add,#b-addtoggle,#addform,#b-autogroup,#b-cleargroups,[data-clear],[data-reset],[data-clearboss],[data-addslot],[data-addcrow],[data-restore],[data-editmap],[data-move],[data-stratedit],[data-stratreset],[data-bossedit],[data-bxall],[data-del],[data-tabmenu]){display:none!important}
body.viewonly :is(.grip,[data-rmslot],[data-rmcrow]){visibility:hidden;pointer-events:none}
body.viewonly .chip{cursor:default}
body.viewonly .edhint{display:none}
body.viewonly :is(input,select,textarea):disabled{opacity:1;color:var(--text);cursor:default}
.ctx .sub{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Ashen Raid Planner<small>BWL · AQ40</small></div>
    <div class="meta">
      <label>Date <input id="f-date" type="text" placeholder="Tue Nov 4"></label>
      <label>Raid leader <input id="f-lead" type="text" placeholder="Name"></label>
    </div>
    <div class="spacer"></div>
    <span class="saved" id="saved"></span>
    <button class="btn" id="b-reset" title="Go back to the starting roster and assignments">Reset</button>
    <button class="btn primary" id="b-share">Share ▾</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="vobanner" id="vobanner">👁 View only. You can look around and copy assignments, but changes are turned off on this link.</div>
<div class="wrap">
  <aside id="bench">
    <div class="rhead"><h3>Roster</h3><span class="cnt" id="rcount"></span><button class="btn small" id="b-addtoggle" type="button">+ Add</button></div>
    <p class="hint edhint">Drag a name onto a slot, or tap it then tap a slot. Drag back here to clear. Double-click a name for their page.</p>
    <form class="addform" id="addform" autocomplete="off" hidden>
      <input id="add-n" placeholder="New member name" maxlength="24">

    const ro=S.ro[raid+'.'+b+'.'+si];

const b64u = {

const LIVE_DB = 'https://ashen-raid-planner-default-rtdb.firebaseio.com';

const LIVE = {id:null, key:null, es:null, last:null, t:null, pt:null, me:rid(8)};
function liveUrl(p){ return LIVE_DB.replace(/\/$/,'')+'/'+p+'.json'; }

async function livePut(){

  try {
    const r=await fetch(liveUrl('plans/'+LIVE.id),{method:'PUT',body:JSON.stringify({k:LIVE.key,s:{d:code,t:Date.now(),u:LIVE.me}})});
    if (!r.ok) throw new Error(r.status);
    LIVE.last=code; setSaved('Live · saved for everyone'); return true;
  } catch(e){ setSaved('Not saved yet · retrying'); clearTimeout(LIVE.t); LIVE.t=setTimeout(livePut,5000); return false; }
}

async function liveApply(d){

  const a=document.activeElement;
  if (drag||rdrag||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='q'&&a.id!=='who')){ clearTimeout(LIVE.pt); LIVE.pt=setTimeout(()=>liveApply(d),1200); return; }

    render(); if (JSON.stringify(S.board)!==before) mapFrames().forEach(f=>sendLoad(f.contentWindow));

}
function liveListen(){

    if (!m) return;
    if (m.path==='/' && e.type==='put') liveApply(m.data);
    else fetch(liveUrl('plans/'+LIVE.id+'/s')).then(r=>r.json()).then(liveApply).catch(()=>{}); };

}
async function liveStart(){

function playerData(n){

    MARKS.forEach(m=>{ [[m.k,'tank'],['pull:'+m.k,'pull'],['cc:'+m.k,'CC']].forEach(([k,role])=>{ if (mkValue(r,k).n===n) out.marks.push({...m,role,raid:r}); }); }); });

    const items=[];
    bossOrder(raid).forEach(bi=>{
      const jobs=[];
      bossSecs(raid,bi).forEach(sec=>sec.slots.forEach(({sl,key})=>{ if (slotValue(key,sl).n===n) jobs.push({sec:sec.h,l:slotLabel(key,sl),m:raid==='BUFF'?'':slotMark(key,sl)}); }));

function bossText(raid,bi){
  const b=DATA[raid][bi]; const lines=[`${b.name}`];
  bossSecs(raid,bi).forEach(sec=>{

    sec.slots.forEach(({sl,key})=>{

/* ---------- interaction ---------- */
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2600); }
function targetOf(el){
  const d = el && el.closest && el.closest('.drop,#bench');
  if (!d) return null;
  if (d.id==='bench') return {t:'bench'};
  return {t:d.dataset.t,k:d.dataset.k};
}
function fromOf(chip){ return chip.dataset.ft ? {t:chip.dataset.ft,k:chip.dataset.fk} : null; }

let rdrag=null; // reordering a row inside its section
function rowStart(grip,y){ const row=grip.closest('.row'); rdrag={row,key:row.dataset.row,sec:row.dataset.sec,tgt:null,pos:null}; row.classList.add('dragrow'); document.body.classList.add('dragging'); }
function rowMove(x,y){
  if (!rdrag) return;
  document.querySelectorAll('.row.before,.row.after').forEach(r=>r.classList.remove('before','after'));
  const el=document.elementFromPoint(x,y); const r=el&&el.closest('.row');
  if (r && r.dataset.sec===rdrag.sec && r!==rdrag.row){
    const bb=r.getBoundingClientRect(); rdrag.pos = y<bb.top+bb.height/2 ? 'before':'after'; rdrag.tgt=r.dataset.row; r.classList.add(rdrag.pos);
  } else rdrag.tgt=null;
  const edge=60; if (y<edge) window.scrollBy(0,-12); else if (y>innerHeight-edge) window.scrollBy(0,12);
}
function rowEnd(){
  if (!rdrag) return; const d=rdrag; rdrag=null;
  document.body.classList.remove('dragging'); d.row.classList.remove('dragrow');
  document.querySelectorAll('.row.before,.row.after').forEach(r=>r.classList.remove('before','after'));
  if (!d.tgt) return;
  const [raid,b,si]=d.sec.split('.');
  const sec=bossSecs(raid,+b).find(x=>x.si===+si); const keys=sec.slots.map(x=>x.key).filter(k=>k!==d.key);
  let i=keys.indexOf(d.tgt); if (d.pos==='after') i++; keys.splice(i,0,d.key);
  S.ro[d.sec]=keys; commit();
}

let drag=null; // {n,from,x0,y0,ghost,started,hi,touch,timer}
function startPress(chip,x,y,touch){
  drag={n:chip.dataset.n,from:fromOf(chip),x0:x,y0:y,started:false,touch,chip};
  if (touch) drag.timer=setTimeout(()=>{ if (drag && !drag.started) beginDrag(x,y); },260);
}
function beginDrag(x,y){
  drag.started=true;
  const g=drag.chip.cloneNode(true); g.classList.add('dragghost'); g.classList.remove('sel');
  document.body.appendChild(g); drag.ghost=g;
  document.body.classList.add('dragging');
  if (navigator.vibrate && drag.touch) navigator.vibrate(10);
  moveDrag(x,y);
}
function moveDrag(x,y){
  if (!drag) return;
  if (!drag.started){
    if (Math.hypot(x-drag.x0,y-drag.y0)>5){
      if (drag.touch){ clearTimeout(drag.timer); drag=null; return; } // a swipe: let the page scroll
      beginDrag(x,y);
    } else return;
  }
  drag.ghost.style.left=x+'px'; drag.ghost.style.top=y+'px';
  const el=document.elementFromPoint(x,y);
  const d=el&&el.closest('.drop');
  if (drag.hi && drag.hi!==d) drag.hi.classList.remove('hi');
  if (d){ d.classList.add('hi'); drag.hi=d; } else drag.hi=null;
  // auto-scroll near the window edges
  const edge=60;
  if (y<edge) window.scrollBy(0,-12); else if (y>innerHeight-edge) window.scrollBy(0,12);
}
function endDrag(x,y){
  if (!drag) return;
  clearTimeout(drag.timer);
  const d=drag; drag=null;
  if (!d.started){
    const now=Date.now();
    if (lastTap.n===d.n && now-lastTap.t<450 && player(d.n)){ lastTap={}; openPlayer(d.n); return; }
    lastTap={n:d.n,t:now}; tapChip(d.n,d.from); return; }
  d.ghost.remove(); document.body.classList.remove('dragging');
  if (d.hi) d.hi.classList.remove('hi');
  const el=document.elementFromPoint(x,y);
  const t=targetOf(el);
  if (t) place(d.n,d.from,t);
}
function cancelDrag(){
  if (!drag) return; clearTimeout(drag.timer);
  if (drag.ghost) drag.ghost.remove(); document.body.classList.remove('dragging');
  if (drag.hi) drag.hi.classList.remove('hi'); drag=null;
}
function tapChip(n,from){
  if (UI.sel && UI.sel.n===n && sameTarget(UI.sel.from,from)){ UI.sel=null; render(); return; }
  if (UI.sel && from){ // tapping a filled slot while holding a name: place it there
    const s=UI.sel; UI.sel=null; place(s.n,s.from,from); return;
  }
  UI.sel={n,from}; render();
}

const VO_BLOCK='.chip,.grip,.drop,.tab,[data-tm],[data-tabmenu],#addform';
['mousedown','touchstart','dragstart','contextmenu'].forEach(t=>document.addEventListener(t,e=>{
  if (VIEW && e.target.closest && e.target.closest(VO_BLOCK) && !(t==='mousedown'&&e.target.closest('.tab'))) { e.stopImmediatePropagation(); if (t!=='touchstart') e.preventDefault(); }
},{capture:true,passive:false}));
document.addEventListener('click',e=>{ if (VIEW && e.target.closest && e.target.closest('.chip,.drop,[data-tm]') && !e.target.closest('[data-player]')) e.stopImmediatePropagation(); },true);
document.addEventListener('mousedown',e=>{
  if (e.button!==0) return;
  const grip=e.target.closest('.grip'); if (grip){ e.preventDefault(); rowStart(grip,e.clientY); return; }
  const chip=e.target.closest('.chip'); if (!chip || chip.classList.contains('dragghost')) return;
  e.preventDefault(); startPress(chip,e.clientX,e.clientY,false);
});
document.addEventListener('mousemove',e=>{ if (drag) moveDrag(e.clientX,e.clientY); if (rdrag) rowMove(e.clientX,e.clientY); });
document.addEventListener('mouseup',e=>{ if (drag) endDrag(e.clientX,e.clientY); if (rdrag) rowEnd(); });
document.addEventListener('touchstart',e=>{
  const grip=e.target.closest('.grip'); if (grip){ rowStart(grip,e.touches[0].clientY); return; }
  const chip=e.target.closest('.chip'); if (!chip || e.touches.length>1) return;
  const t=e.touches[0]; startPress(chip,t.clientX,t.clientY,true);
},{passive:true});
document.addEventListener('touchmove',e=>{
  if (rdrag){ e.preventDefault(); rowMove(e.touches[0].clientX,e.touches[0].clientY); return; }
  if (!drag) return; const t=e.touches[0];
  if (drag.started) e.preventDefault();
  moveDrag(t.clientX,t.clientY);
},{passive:false});
document.addEventListener('touchend',e=>{
  if (rdrag){ rowEnd(); return; }
  if (!drag) return; const t=e.changedTouches[0];
  const started=drag.started; endDrag(t.clientX,t.clientY);
  e.preventDefault(); // stop the synthetic click / mouse events
  void started;
},{passive:false});
document.addEventListener('touchcancel',()=>{ cancelDrag(); if (rdrag) rowEnd(); });

document.addEventListener('contextmenu',e=>{
  if (drag && drag.started){ e.preventDefault(); return; }
  const t=e.target.closest('.tab'); if (t){ e.preventDefault(); tabMenu(t.dataset.tab,e.clientX,e.clientY); }
});
let dragTab=null;
document.addEventListener('dragstart',e=>{ const t=e.target.closest&&e.target.closest('.tab'); if (!t) return; dragTab=t.dataset.tab; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragTab);}catch(_){} });
document.addEventListener('dragover',e=>{ if (!dragTab) return; const t=e.target.closest&&e.target.closest('.tab'); document.querySelectorAll('.tab.dragover').forEach(x=>x.classList.remove('dragover')); if (t){ e.preventDefault(); t.classList.add('dragover'); } });
document.addEventListener('drop',e=>{ if (!dragTab) return; e.preventDefault(); const t=e.target.closest&&e.target.closest('.tab');
  if (t && t.dataset.tab!==dragTab){ const o=tabOrder().filter(k=>k!==dragTab); o.splice(o.indexOf(t.dataset.tab),0,dragTab); S.tabs.order=o; commit(); }
  dragTab=null; });
document.addEventListener('dragend',()=>{ dragTab=null; document.querySelectorAll('.tab.dragover').forEach(x=>x.classList.remove('dragover')); });
document.addEventListener('keydown',e=>{ if (e.key==='Enter' && e.target.dataset && (e.target.dataset.lb||e.target.dataset.crow)){ e.target.blur(); return; } });
document.addEventListener('keydown',e=>{ if (e.key==='Escape'){ closeMenu();  cancelDrag(); if (UI.sel){UI.sel=null; render();} } });

document.addEventListener('click',e=>{
  const el=e.target;
  const tm=el.closest('[data-tm]'); if (tm){ const [a,k]=tm.dataset.tm.split('|'); closeMenu();
    if (a==='left') moveTab(k,-1); else if (a==='right') moveTab(k,1);
    else if (a==='hide'){ S.tabs.hidden.push(k); commit(); toast(`${TABS[k]} hidden. Use ⋯ at the end of the tabs to bring it back.`); }
    else if (a==='show'){ S.tabs.hidden=S.tabs.hidden.filter(x=>x!==k); UI.tab=k; commit(); }
    else if (a==='reset'){ S.tabs={order:[],hidden:[]}; commit(); }
    return; }
  if (!el.closest('#ctx')) closeMenu();
  const tmb=el.closest('[data-tabmenu]'); if (tmb){ const r=tmb.getBoundingClientRect(); openMenu(r.left,r.bottom+4,'<div class="lbl">Tabs</div><div class="hint" style="padding:0 10px 4px;margin:0">Drag tabs to reorder, or right-click (long-press on a phone) for options.</div>'+hiddenList()); return; }
  const pv=el.closest('[data-player]'); if (pv){ UI.who=pv.dataset.player; UI.tab='player'; if (S.tabs.hidden.includes('player')) S.tabs.hidden=S.tabs.hidden.filter(x=>x!=='player'); render(); window.scrollTo(0,0); return; }
  const lr=el.closest('[data-lr]'); if (lr){ UI.lr=lr.dataset.lr; render(); return; }
  const ac=el.closest('[data-addcrow]'); if (ac){ const L=lineup(ac.dataset.addcrow); const k='c'+(++S.cn); L.rows.push([k,'New role']); commit();
    const inp=document.querySelector(`[data-crow="${ac.dataset.addcrow}/${k}"]`); if (inp){ inp.focus(); inp.select(); } return; }
  const rc=el.closest('[data-rmcrow]'); if (rc){ const [r,k]=lsplit(rc.dataset.rmcrow); const L=lineup(r); const row=L.rows.find(x=>x[0]===k);
    if (row && L.core[k] && !confirm(`Remove the ${row[1]} row (${L.core[k]})?`)) return;
    L.rows=L.rows.filter(x=>x[0]!==k); delete L.core[k]; commit(); return; }
  if (el.closest('[data-copymarks]')){ const R=UI.lr, Lr=lineup(R); const t=MARKS.map(m=>{ const parts=[['Tank',mkValue(R,m.k).n],['Pull',mkValue(R,'pull:'+m.k).n],['CC',mkValue(R,'cc:'+m.k).n]].filter(x=>x[1]);
      return parts.length?`{${m.k.toLowerCase()}} ${Lr.mkw[m.k]??m.w}: `+parts.map(x=>x[0]+' '+x[1]).join(', '):''; }).filter(Boolean).join('\n');
    navigator.clipboard.writeText(t).then(()=>toast('Copied. Marks show as icons in WoW chat.'),()=>prompt('Copy:',t)); return; }
  const pl=el.closest('[data-plink]'); if (pl){ shareFor(pl.dataset.plink); return; }
  const pt=el.closest('[data-ptext]'); if (pt){ const t=playerText(pt.dataset.ptext); navigator.clipboard.writeText(t).then(()=>toast('Copied.'),()=>prompt('Copy:',t)); return; }
  const tab=el.closest('[data-tab]'); if (tab){ UI.tab=tab.dataset.tab; if (S.tabs.hidden.includes(UI.tab)) S.tabs.hidden=S.tabs.hidden.filter(x=>x!==UI.tab); render(); window.scrollTo(0,0); return; }
  const clr=el.closest('[data-clear]'); if (clr){ const [t,k]=clr.dataset.clear.split('|'); setVal({t,k},''); commit(); return; }
  const rs=el.closest('[data-reset]'); if (rs){ delete S.a[rs.dataset.reset]; commit(); return; }
  const tg=el.closest('[data-toggle]'); if (tg){ const id=tg.dataset.toggle; UI.collapsed.has(id)?UI.collapsed.delete(id):UI.collapsed.add(id); render(); return; }
  const jp=el.closest('[data-jump]'); if (jp){ const id=jp.dataset.jump; UI.collapsed.delete(id); render(); document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const ex=el.closest('[data-expand]'); if (ex){ DATA[ex.dataset.expand].forEach((_,i)=>UI.collapsed.delete(ex.dataset.expand+'-'+i)); render(); return; }
  const co=el.closest('[data-collapse]'); if (co){ DATA[co.dataset.collapse].forEach((_,i)=>UI.collapsed.add(co.dataset.collapse+'-'+i)); render(); return; }
  const cp=el.closest('[data-copy]'); if (cp){ const [r,b]=cp.dataset.copy.split('|'); const txt=bossText(r,+b);
    navigator.clipboard.writeText(txt).then(()=>toast('Copied. Marks like {skull} show as icons in WoW chat.'),()=>prompt('Copy:',txt)); return; }
  const rb=el.closest('[data-rmboss]'); if (rb){ const [r,b]=rb.dataset.rmboss.split('|'); const e=S.eb[r][+b-BASE[r].length];
    if (e && confirm(`Remove the ${e.n} card? Its map stays on the strategy board.`)){ e.gone=1; commit(); } return; }
  const cb=el.closest('[data-clearboss]'); if (cb){ const [r,b]=cb.dataset.clearboss.split('|');
    if (!confirm('Clear the changes on this boss and go back to the defaults?')) return;
    const p=r+'.'+b+'.'; Object.keys(S.a).forEach(k=>{ if(k.startsWith(p)) delete S.a[k]; }); Object.keys(S.m).forEach(k=>{ if(k.startsWith(p)) delete S.m[k]; }); commit(); return; }
  const as=el.closest('[data-addslot]'); if (as){ const sk=as.dataset.addslot; const [r,b]=sk.split('.'); const key=`${r}.${b}.c${++S.cn}`;
    (S.cx[sk]=S.cx[sk]||[]).push(key); commit(); const inp=document.querySelector(`[data-lb="${key}"]`); if (inp){ inp.focus(); inp.select(); } return; }
  const rm=el.closest('[data-rmslot]'); if (rm){ const key=rm.dataset.rmslot; const [r,b,i]=key.split('.');
    if (i[0]==='c'){ for (const sk in S.cx) S.cx[sk]=S.cx[sk].filter(k=>k!==key); } else S.hide[key]=1;
    delete S.a[key]; delete S.m[key]; delete S.lb[key]; commit();
    toast('Row removed. "Restore rows" on the boss brings back the built-in ones.'); return; }
  const rr=el.closest('[data-restore]'); if (rr){ const p=rr.dataset.restore+'.'; Object.keys(S.hide).forEach(k=>{ if(k.startsWith(p)) delete S.hide[k]; }); commit(); return; }
  const em=el.closest('[data-editmap]'); if (em){ const fr=em.closest('.mapwrap').querySelector('iframe'); openMapEditor(em.dataset.editmap, null, false); return; }
  const mv=el.closest('[data-move]'); if (mv){ const [r,b,d]=mv.dataset.move.split('|'); const o=bossOrder(r); const i=o.indexOf(+b), j=i+(+d);
    if (j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; S.ord[r]=o; commit(); document.getElementById(r+'-'+b).scrollIntoView({block:'nearest'}); return; }
  const se=el.closest('[data-stratedit]'); if (se){ UI.editStrat=se.dataset.stratedit; render(); const t=document.querySelector(`[data-strat="${UI.editStrat}"]`); if (t) t.focus(); return; }
  const sd=el.closest('[data-stratdone]'); if (sd){ UI.editStrat=null; render(); return; }
  const sr=el.closest('[data-stratreset]'); if (sr){ delete S.st[sr.dataset.stratreset]; UI.editStrat=null; commit(); return; }
  const be=el.closest('[data-bossedit]'); if (be){ const i=+be.dataset.bossedit; UI.bossEdit = UI.bossEdit===i?null:i; render(); return; }
  const ba=el.closest('[data-bxall]'); if (ba){ const [i,raid,on]=ba.dataset.bxall.split('|'); const p=S.roster[+i]; p.x=(p.x||[]).filter(id=>!id.startsWith(raid+'.'));
    if (on==='0') DATA[raid].forEach((_,bi)=>p.x.push(raid+'.'+bi)); commit(); return; }
  const del=el.closest('[data-del]'); if (del){ const p=S.roster[+del.dataset.del]; if (confirm(`Remove ${p.n} from the roster?`)){ S.roster.splice(+del.dataset.del,1); commit(); } return; }
  if (el.closest('#b-add')){ let i=1; while(player('New player '+i)) i++; S.roster.push({n:'New player '+i,c:'Warrior',r:'Melee',st:'Rotation',out:false,x:[]}); commit();
    const inp=document.querySelectorAll('.rt input.nm'); const last=inp[inp.length-1]; if (last){ last.focus(); last.select(); } return; }
  if (el.closest('#b-autogroup')){ const un=S.roster.filter(p=>!p.out&&!groupOf(p.n)).map(p=>p.n);
    for (let g=0;g<8&&un.length;g++) for (let i=0;i<5&&un.length;i++) if (!S.groups[g][i]) S.groups[g][i]=un.shift();
    commit(); if (un.length) toast(`No room for ${un.length} more.`); return; }
  if (el.closest('#b-cleargroups')){ if (confirm('Empty all 8 groups?')){ S.groups=S.groups.map(g=>g.map(()=>'')); commit(); } return; }
  const lvb=el.closest('[data-live]'); if (lvb){ closeMenu();
    if (lvb.dataset.live==='start') liveStart();
    else { liveForget(); S=defaults(); history.replaceState(null,'',location.pathname); load().then(()=>{ render(); mapFrames().forEach(f=>sendLoad(f.contentWindow)); toast("Back to this browser's own plan. Your edit link still opens the live plan."); }); }
    return; }
  const sh=el.closest('[data-share]'); if (sh){ closeMenu(); share(sh.dataset.share==='view'); return; }
  if (el.closest('#b-share')){ shareMenu(el.closest('#b-share')); return; }
  if (el.closest('#b-reset')){ if (confirm(LIVE.id?'Reset the live plan to the starting roster and assignments? This changes it for everyone.':'Reset everything to the starting roster and assignments? Your current plan in this browser will be replaced.')){ S=defaults(); if (!LIVE.id) history.replaceState(null,'',location.pathname); commit(); mapFrames().forEach(f=>sendLoad(f.contentWindow)); toast('Reset to the starting plan.'); } return; }
  if (el.closest('#b-addtoggle')){ const f=document.getElementById('addform'); f.hidden=!f.hidden; if (!f.hidden) document.getElementById('add-n').focus(); return; }
  if (el.closest('#selcancel')){ UI.sel=null; render(); return; }
  // tap-to-place: a name is selected and an empty slot (or the roster panel) is tapped
  if (UI.sel && !el.closest('.chip')){
    const d=el.closest('.drop'); if (d){ const s=UI.sel; UI.sel=null; place(s.n,s.from,{t:d.dataset.t,k:d.dataset.k}); return; }
    if (el.closest('#bench') && UI.sel.from){ const s=UI.sel; UI.sel=null; place(s.n,s.from,{t:'bench'}); return; }
  }
});

document.addEventListener('change',e=>{
  const el=e.target;
  if (el.dataset.bx){ const [i,id]=el.dataset.bx.split('|'); const p=S.roster[+i]; p.x=(p.x||[]).filter(z=>z!==id); if (!el.checked) p.x.push(id); commit(); return; }
  if (el.dataset.mkw){ const [r,k]=lsplit(el.dataset.mkw); const L=lineup(r), m=MK[k]; const v=el.value.trim(); if (!v||v===m.w) delete L.mkw[k]; else L.mkw[k]=v; commit(); return; }
  if (el.dataset.crow){ const [r,k]=lsplit(el.dataset.crow); const row=lineup(r).rows.find(x=>x[0]===k); const v=el.value.trim(); if (row && v) row[1]=v; commit(); return; }
  if (el.id==='who'){ UI.who=el.value; render(); return; }
  if (el.dataset.lb){ const v=el.value.trim(); if (v) S.lb[el.dataset.lb]=v; else delete S.lb[el.dataset.lb]; commit(); return; }
  if (el.dataset.mk){ S.m[el.dataset.mk]=el.value; commit(); return; }
  if (el.dataset.ri!==undefined){
    const p=S.roster[+el.dataset.ri], f=el.dataset.f;
    if (f==='n'){
      const nn=el.value.trim(); if (!nn || (nn!==p.n && player(nn))){ toast(nn?`${nn} is already on the roster.`:'Name can’t be empty.'); render(); return; }
      renamePlayer(p.n,nn);
    } else if (f==='in') p.out=!el.checked;
    else p[f]=el.value;
    commit(); return;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if (el.dataset.strat){ S.st[el.dataset.strat]=el.value; clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,400); return; }
  if (el.dataset.note){ S.notes[el.dataset.note]=el.value; clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,400); return; }
  if (el.id==='q'){ UI.q=el.value; renderBench(); return; }
  if (el.id==='f-date'){ S.date=el.value; clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,400); }
  if (el.id==='f-lead'){ S.lead=el.value; clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,400); }
});
function renamePlayer(o,n){
  const p=player(o); if (p) p.n=n;
  LRAIDS.forEach(r=>{ const L=lineup(r);
    for (const k in L.core) if (L.core[k]===o) L.core[k]=n;
    for (const k in L.mk) if (L.mk[k]===o) L.mk[k]=n; });
  for (const k in S.a) if (S.a[k]===o) S.a[k]=n;
  S.groups.forEach(g=>g.forEach((x,i)=>{ if (x===o) g[i]=n; }));
}
document.getElementById('add-c').innerHTML = Object.keys(CLASSES).map(c=>`<option>${c}</option>`).join('');
document.getElementById('add-r').innerHTML = ROLES.map(r=>`<option value="${r}">${r==='Healer'?'Heal':r}</option>`).join('');
document.getElementById('add-r').value='Melee';
document.getElementById('addform').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=document.getElementById('add-n'); const n=inp.value.trim();
  if (!n) { inp.focus(); return; }
  if (player(n)) { toast(`${n} is already on the roster.`); return; }
  S.roster.push({n,c:document.getElementById('add-c').value,r:document.getElementById('add-r').value,st:'Rotation',out:false,x:[]});
  inp.value=''; commit(); toast(`Added ${n}. Drag them onto any slot.`); inp.focus();
});
window.addEventListener('scroll',closeMenu,{passive:true});
/* ---------- strategy map frames (board.html) ---------- */
let OV=null;
const mapFrames = () => [...document.querySelectorAll('iframe.mapframe, #mapov iframe')];
function sendLoad(win,extra={}){ try { win.postMessage(Object.assign({ab:1,type:'load',pages:S.board,assets:S.bassets},extra),'*'); } catch(e){} }
function openMapEditor(boss,page,create){
  closeMapEditor();
  OV={page};
  const d=document.createElement('div'); d.id='mapov';
  d.innerHTML=`<iframe title="Map editor" src="board.html?edit=1${boss?'&boss='+encodeURIComponent(boss):''}${create?'&create=1':''}"></iframe>`;
  document.body.appendChild(d); document.body.classList.add('ovopen');
}
function closeMapEditor(){ const d=document.getElementById('mapov'); if (d) d.remove(); document.body.classList.remove('ovopen'); OV=null; }
window.addEventListener('message',e=>{
  const m=e.data; if (!m||!m.ab) return;
  const fr=mapFrames().find(f=>f.contentWindow===e.source); if (!fr) return;
  if (m.type==='ready'){ sendLoad(e.source, fr.closest('#mapov')&&OV&&OV.page!=null?{page:OV.page}:{}); return; }
  if (m.type==='pages'){ notePages(m.names); return; }
  if (m.type==='save'){
    S.board=m.pages; S.bassets=m.assets||{}; notePages(m.pages.map(p=>p.name));
    clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,300);
    mapFrames().forEach(f=>{ if (f.contentWindow!==e.source) sendLoad(f.contentWindow); });
    return;
  }
  if (m.type==='edit'){ const boss=fr.dataset.boss||''; openMapEditor(boss, m.page, !!m.create); return; }
  if (m.type==='close'){ closeMapEditor(); mapFrames().forEach(f=>sendLoad(f.contentWindow)); return; }
});
document.addEventListener('toggle',e=>{ const d=e.target; if (d.dataset&&d.dataset.mech){ d.open?UI.mech.add(d.dataset.mech):UI.mech.delete(d.dataset.mech); } },true);
window.addEventListener('hashchange',async()=>{ await load(); render(); });

load().then(render);
